name: build-standalone

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: macos-13
            artifact: macos-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[standalone]'
      - run: python -m unittest discover -s tests
      - run: python scripts/build_standalone.py
      - run: python scripts/smoke_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: sprinter-mkdll-${{ matrix.artifact }}
          path: dist/
